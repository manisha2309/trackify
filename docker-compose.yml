services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:4001
      - CAREER_SERVICE_URL=http://career-service:4002
      - LEETCODE_SERVICE_URL=http://leetcode-service:4003
      - COLLEGE_SERVICE_URL=http://college-service:4004
      - ROADMAP_SERVICE_URL=http://roadmap-service:4005
      - NOTIFICATION_SERVICE_URL=http://notification-service:4006
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - nexpath-network

  auth-service:
    build: ./services/auth-service
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=development
      - PORT=4001
      - MONGODB_URI=mongodb+srv://${MONGODB_USER}:${MONGODB_PASSWORD}@${MONGODB_HOST}/nexpath-auth?retryWrites=true&w=majority&appName=Cluster0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    networks:
      - nexpath-network

  career-service:
    build: ./services/career-service
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=development
      - PORT=4002
      - MONGODB_URI=mongodb+srv://${MONGODB_USER}:${MONGODB_PASSWORD}@${MONGODB_HOST}/nexpath-auth?retryWrites=true&w=majority&appName=Cluster0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    networks:
      - nexpath-network

  leetcode-service:
    build: ./services/leetcode-service
    ports:
      - "4003:4003"
    environment:
      - NODE_ENV=development
      - PORT=4003
      - MONGODB_URI=mongodb+srv://${MONGODB_USER}:${MONGODB_PASSWORD}@${MONGODB_HOST}/nexpath-leetcode?retryWrites=true&w=majority&appName=Cluster0
      - REDIS_URL=redis://redis:6379
      - LEETCODE_GRAPHQL_URL=https://leetcode.com/graphql
    depends_on:
      - mongo
      - redis
    networks:
      - nexpath-network

  college-service:
    build: ./services/college-service
    ports:
      - "4004:4004"
    environment:
      - NODE_ENV=development
      - PORT=4004
      - MONGODB_URI=mongodb+srv://${MONGODB_USER}:${MONGODB_PASSWORD}@${MONGODB_HOST}/nexpath-colleges?retryWrites=true&w=majority&appName=Cluster0
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    networks:
      - nexpath-network

  roadmap-service:
    build: ./services/roadmap-service
    ports:
      - "4005:4005"
    environment:
      - NODE_ENV=development
      - PORT=4005
      - MONGODB_URI=mongodb+srv://${MONGODB_USER}:${MONGODB_PASSWORD}@${MONGODB_HOST}/nexpath-roadmaps?retryWrites=true&w=majority&appName=Cluster0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongo
    networks:
      - nexpath-network

  notification-service:
    build: ./services/notification-service
    ports:
      - "4006:4006"
    environment:
      - NODE_ENV=development
      - PORT=4006
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_USER=${SMTP_USER:-your@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-your_app_password}
    depends_on:
      - redis
    networks:
      - nexpath-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:4000
    networks:
      - nexpath-network

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - nexpath-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nexpath-network

volumes:
  mongo-data:
  redis-data:

networks:
  nexpath-network:
    driver: bridge